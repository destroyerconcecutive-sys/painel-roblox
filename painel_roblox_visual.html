<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Roblox - Eye Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .painel {
            position: relative;
            width: 140px;
            height: 160px;
            border-radius: 16px;
            border: 2px solid #3b82f6;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(13, 27, 61, 0.9), rgba(10, 10, 20, 0.95));
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 15px;
        }

        /* ── OLHO PISCANDO DE BAIXO PRA CIMA ──────────────────────────────── */
        .eye-container {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8px;
        }

        .eye {
            width: 48px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .eye::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            animation: blink-bottom 3s ease-in-out infinite;
            z-index: 10;
        }

        .iris {
            width: 14px;
            height: 14px;
            background: #3b82f6;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pupil {
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes blink-bottom {
            0%, 85%, 100% { 
                height: 0%;
            }
            90% { 
                height: 100%;
            }
            92% { 
                height: 0%;
            }
        }

        .eye::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 8px;
            width: 2px;
            height: 5px;
            background: #ccc;
            border-radius: 50%;
            opacity: 0.6;
        }

        /* ── BOTÃO ON ──────────────────────────────────────── */
        .btn-on {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: 1px solid #60a5fa;
            padding: 10px 20px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 90%;
        }

        .btn-on:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
        }

        .btn-on:active {
            transform: scale(0.95);
        }

        /* ── CAIXA DE NÚMERO ──────────────────────────────── */
        .numero-box {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: 1.5px solid #60a5fa;
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            width: 60px;
            height: 40px;
            text-align: center;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
            cursor: text;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .numero-box:hover {
            border-color: #93c5fd;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }

        .numero-box:focus {
            outline: none;
            border-color: #93c5fd;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.9);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="painel">
        <!-- Olho piscando -->
        <div class="eye-container">
            <div class="eye">
                <div class="iris">
                    <div class="pupil"></div>
                </div>
            </div>
        </div>

        <!-- Botão ON -->
        <button class="btn-on">ON</button>

        <!-- Caixa número -->
        <input type="text" class="numero-box" value="100" maxlength="3">
    </div>
</body>
</html>
